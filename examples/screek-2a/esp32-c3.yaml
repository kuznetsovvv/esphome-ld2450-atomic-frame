    id: ble_beacon_2_rssi
  # --- INSTRUMENTATION (perf-baseline test 2026-07-28) - loop_time = CPU headroom ---
  - platform: debug
    free:
      name: "ESP Heap Free (debug)"
      id: dbg_heap_free
    block:
      name: "ESP Heap Max Block"
      id: dbg_heap_block
    loop_time:
      name: "ESP Loop Time"
      id: dbg_loop_time
  - platform: internal_temperature
    id: sys_esp_temperature
    name: ESP Temperature
    unit_of_measurement: °C
    device_class: TEMPERATURE
    update_interval: 10s
    entity_category: "diagnostic"
  # Measured chip-restart blackout: ms from the 0xA3 restart command to the FIRST periodic
  # frame the LD2450 emits after (frames flow regardless of motion = the true reboot gap).
  # Published by the UART sequence each time "LD2450 Restart" fires.
  - platform: template
    name: "LD2450 Restart Recovery"
    id: chip_restart_recovery
    icon: mdi:timer-sync-outline
    unit_of_measurement: ms
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: uptime
    name: ESP Uptime
    id: sys_uptime
    update_interval: 10s
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 10s
    entity_category: "diagnostic"
  - platform: template
    id: esp_memory
    icon: mdi:memory
    name: ESP Free Memory
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024;
    unit_of_measurement: 'kB'
    state_class: measurement
    entity_category: "diagnostic"
    update_interval: 10s
  - platform: bh1750
    name: "Illuminance"
    accuracy_decimals: 1
    id: bh1750_light
    update_interval: 1s
    force_update: true
    filters:
      - lambda: !lambda |-
          auto time = id(time_now).utcnow().timestamp;
          if (id(last_illuminance) == x){
            if (time >= (id(last_illuminance_timestamp) + 60)){
              id(last_illuminance_timestamp) = time;
              return x;
            } else {
              return {};
            }
          }
          if (id(bh1750_fast_update).state){
            id(last_illuminance) = x;
            // ESP_LOGD("custom", "Fast Update BH1850");
            id(last_illuminance_timestamp) = time;
            return x;
          }
          if (abs(id(last_illuminance) - x) > 1){

              id(last_illuminance) = x;
              id(last_illuminance_timestamp) = time;
              return x;
          }
          return {};

