    # on a generic ESP32-C3, so both board-only LED pins use explicit overrides.
    pin:
      number: GPIO13
      ignore_pin_validation_error: true
    internal: True
    restore_mode: ALWAYS_OFF
  - platform: binary
    name: "Red Info Light"
    output: board_info_ed
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF

time:
  - platform: sntp
    id: time_now

output:
  - platform: gpio
    id: board_info_ed
    pin:
      number: GPIO12
      ignore_pin_validation_error: true

select:
  # On-chip region mode applied to the region(s) above by "LD2450 Set Region Filter".
  #   Disabled  = chip reports all targets (region boxes ignored)
  #   Detection = chip reports ONLY targets inside the region(s)
  #   Filter    = chip EXCLUDES targets inside the region(s)
  - platform: template
    name: "LD2450 Zone Type"
    id: chip_zone_type
    icon: mdi:select-group
    entity_category: config
    optimistic: True
    options:
      - "Disabled"
      - "Detection"
      - "Filter"
    initial_option: "Disabled"
    restore_value: True

switch:
  # BLE scan master: ON starts continuous passive scanning. The switch is
  # optimistic and has no independent controller-state feedback.
  - platform: template
    name: "BLE Scan"
    id: ble_scan_sw
    icon: mdi:bluetooth-settings
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - esp32_ble_tracker.start_scan:
          continuous: true
    turn_off_action:
      - esp32_ble_tracker.stop_scan:
  - platform: factory_reset
    name: Factory Reset
    disabled_by_default: True
    icon: mdi:heart-broken
    entity_category: diagnostic
  - platform: template
    name: Zout1 Enable
    id: zone_ex1_enable
    optimistic: True
    icon: mdi:account-cancel
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: Zone Enable
    id: zone_fn_enable
    optimistic: True
    icon: mdi:target-variant
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Illuminance Fast-Update
    id: bh1750_fast_update
    optimistic: True
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:run-fast
  # Multi vs single target tracking on the chip. Factory default = multi (on).
  # Optimistic display; "LD2450 Target Mode (chip)" text sensor shows the read-back truth.
  - platform: template
    name: "LD2450 Multi-Target"
    id: chip_multi_target
    icon: mdi:account-multiple
    entity_category: config
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
