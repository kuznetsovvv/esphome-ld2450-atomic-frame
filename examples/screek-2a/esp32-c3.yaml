    id: target2_position
    icon: mdi:directions
  - platform: template
    name: "Target3 Position"
    id: target3_position
    icon: mdi:directions

  # ---- LD2450 chip read-back (values published by the UART ACK parser in uart:) ----
  - platform: template
    name: "LD2450 Chip Version"
    id: chip_ld2450_version
    icon: mdi:chip
    entity_category: diagnostic
  - platform: template
    name: "LD2450 Target Mode (chip)"
    id: chip_target_mode
    icon: mdi:account-multiple
    entity_category: diagnostic
  - platform: template
    name: "LD2450 Zone Type (chip)"
    id: chip_zone_type_state
    icon: mdi:select-group
    entity_category: diagnostic

number:
  # ---- runtime LD2450 publish throttle (replaces the hardcoded 50ms gate) ----
  # 0 = no throttle (chip's native ~10-12 Hz becomes the ceiling). Safe: the gate is
  # an unsigned compare, no division. Lower = higher rate + more WiFi/API load on the C3.
  - platform: template
    name: "LD2450 Publish Throttle"
    id: ld2450_throttle_ms
    min_value: 0
    max_value: 1000
    step: 10
    mode: box
    unit_of_measurement: ms
    icon: mdi:speedometer
    entity_category: config
    optimistic: True
    initial_value: 50
    restore_value: True
  # ---- on-chip region filter coords (mm), 3 regions. Apply via "LD2450 Set Region Filter".
  # The chip filter is HARDWARE-level: in Filter mode the LD2450 STOPS REPORTING targets inside
  # these boxes (so a filtered reflection never consumes a target slot). The Zone Type select
  # mode (Disabled/Detection/Filter) is GLOBAL across all 3 regions. Unused regions = leave 0.
  - platform: template
    name: "LD2450 Region1 X1"
    id: chip_region1_x1
    min_value: -4000
    max_value: 4000
    step: 10
    mode: box
    unit_of_measurement: mm
    icon: mdi:arrow-left-bold
    entity_category: config
    optimistic: True
    initial_value: 0
    restore_value: True
  - platform: template
    name: "LD2450 Region1 Y1"
    id: chip_region1_y1
    min_value: 0
    max_value: 6000
    step: 10
    mode: box
