binary_sensor:
  # --- Optional BLE presence. Each UUID/major/minor tuple must be unique and
  # private. The -80 dBm default mirrors the tested derivative but is only a
  # starting point; calibrate it for the beacon, enclosure, and RF environment.
  - platform: ble_presence
    ibeacon_uuid: !secret ble_beacon_1_uuid
    ibeacon_major: !secret ble_beacon_1_major
    ibeacon_minor: !secret ble_beacon_1_minor
    name: "${beacon_1_name} Present"
    id: ble_beacon_1_present
    timeout: ${ble_presence_timeout}
    min_rssi: ${ble_presence_min_rssi}
  - platform: ble_presence
    ibeacon_uuid: !secret ble_beacon_2_uuid
    ibeacon_major: !secret ble_beacon_2_major
    ibeacon_minor: !secret ble_beacon_2_minor
    name: "${beacon_2_name} Present"
    id: ble_beacon_2_present
    timeout: ${ble_presence_timeout}
    min_rssi: ${ble_presence_min_rssi}
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: template
    name: "Any Presence"
    id: any_target_exsits
    device_class: occupancy
    filters:
      - delayed_off: !lambda |-
          if (!id(init_zone_publish) || !id(zone_fn_enable).state) {
            return 0;
          };
          return id(any_presence_timeout).state * 1000.0;
  - platform: template
    name: "Zone1 Presence"
    id: zone1_target_exsits
    device_class: occupancy
    filters:
      - delayed_off: !lambda |-
          if (!id(init_zone_publish) || !id(zone_fn_enable).state) {
            return 0;
          }
          return id(zone1_x_timeout).state * 1000.0;
  - platform: template
    name: "Zone2 Presence"
    id: zone2_target_exsits
    device_class: occupancy
    filters:
      - delayed_off: !lambda |-
          if (!id(init_zone_publish) || !id(zone_fn_enable).state) {
            return 0;
          }
          return id(zone2_x_timeout).state * 1000.0;
  - platform: template
    name: "Zone3 Presence"
    id: zone3_target_exsits
    device_class: occupancy
    filters:
      - delayed_off: !lambda |-
          if (!id(init_zone_publish) || !id(zone_fn_enable).state) {
            return 0;
          }
