# SCREEK Human Sensor 2A derivative: atomic LD2450 frames, direct chip control,
# optional ESP32 BLE presence, and performance diagnostics.
#
# Upstream source:
# https://github.com/screekworkshop/screek-human-sensor/blob/396e597e99a4ab9902e3fc09df515a892b38e3ef/2a/yaml/human-sensor-2a-stable-github.yaml
# Copyright (c) 2026 screekworkshop
# Modifications copyright (c) 2026 kuznetsovvv and contributors
# SPDX-License-Identifier: MIT
# See ../../LICENSE and ../../LICENSES/SCREEK-MIT.txt.
#
# The feature lineage was exercised on a SCREEK 2A using private firmware. This
# public derivative removes real identifiers, replaces credentials, and suppresses
# MAC publication, so this exact sanitized file still requires physical validation.
# It is unofficial and is not supported or endorsed by SCREEK Workshop.
#
# Adding the BLE stack can change the flash partition layout. Treat the first
# installation as a USB/serial flash unless OTA compatibility is independently
# verified, and keep a known-good recovery image.

substitutions:
  device_name: screek-2a-atomic-frame
  friendly_name: SCREEK 2A Atomic Frame
  beacon_1_name: BLE Beacon 1
  beacon_2_name: BLE Beacon 2
  ble_presence_timeout: 30s
  ble_presence_min_rssi: -80dB

# This is a custom firmware for Human Presence Sensor 2A
# https://docs.screek.io/2a

esphome:
  name: ${device_name}
  comment: Unofficial SCREEK Human Sensor 2A derivative
  friendly_name: ${friendly_name}
  min_version: 2026.6.1
  name_add_mac_suffix: False
  platformio_options:
    board_build.flash_mode: dio
    # board_build.f_cpu: 80000000L
  project:
    name: kuznetsovvv.screek_2a_atomic_frame
    version: 0.1.0
  on_boot:
    - priority: -200
      then:
        lambda: |-
          id(zone1_target_exsits).publish_state(false);
          id(zone2_target_exsits).publish_state(false);
          id(zone3_target_exsits).publish_state(false);
          id(zone_ex1_target_exsits).publish_state(false);
    # On every boot, QUERY the chip so the read-back entities (BT state, version, mode, zone
    # type) auto-populate — and so "LD2450 Bluetooth Active" reflects reality after each boot
    # (you can alert on it flipping back on). The LD2450 PERSISTS bt-off in its OWN flash across
    # reboots/power-cycles (verified 2026-06-29), so re-disabling every boot is NOT needed and
    # would cost a ~1.5s radar gap. BT only re-enables after an LD2450 FACTORY RESET — if you
    # ever do that, press "LD2450 Bluetooth Disable" again (or swap the query below for the
    # disable script: id: ld2450_cmd_bt / enable: false).
    - priority: -300
      then:
        - delay: 8s
        - script.execute: ld2450_cmd_query

preferences:
    flash_write_interval: 5s

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

globals:
  - id: last_update_ld2450
    type: unsigned long
    restore_value: no
    initial_value: '0'
  # restart-recovery measurement: track the MAX inter-frame gap in a window after a 0xA3
  # restart (the reboot = one big gap; normal frames are ms apart). last_frame_seen_ms updates
  # on EVERY periodic frame (before the publish throttle); restart_watch_until_ms != 0 arms it.
  - id: last_frame_seen_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: restart_watch_until_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: restart_max_gap_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: init_zone_publish
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_illuminance
    type: float
    restore_value: no
    initial_value: "-1"
  - id: last_illuminance_timestamp
    type: int
    restore_value: no
    initial_value: "-1"

improv_serial:

logger:

debug:
  update_interval: 10s

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  reboot_timeout: 10min
  ap:
    ssid: "SCREEK 2A Recovery"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
  ota: false

# === BLE (2026-08-07): esp32_ble_tracker for beacon presence + contention testing.
# continuous:false => stack present but NOT scanning at boot (= "BLE stack idle";
# diff vs the no-BLE instr baseline = idle-stack cost). Passive scan (active:false)
# = lighter radio duty; iBeacon adverts don't need scan-requests. Turn scanning on
# via switch.ble_scan. First flash of THIS build needs USB (partition resize).
esp32_ble_tracker:
  scan_parameters:
    continuous: false
    # 2026-08-11: duty raised 9% -> 50% (window 100 / interval 200) for the contention
    # perf test + ~5x better iBeacon capture up close. C3 shares ONE radio between WiFi
    # and BLE (time-mux coex), so 50% duty measurably taxes WiFi - that's the experiment.
    # NOT 100% (window==interval) which would starve WiFi. Passive: iBeacon adverts are
    # connectionless, no scan-requests needed (lighter radio load).
    interval: 200ms
    window: 100ms
    active: false

text_sensor:
  # --- ATOMIC FRAME (2026-08-07): coherent, device-timestamped radar frame,
  # published imperatively from the UART lambda. Payload
  # "t_ms|x1,y1,v1|x2,y2,v2|x3,y3,v3" in RAW mm. Consumed by pyscript radar_frame.py.
  # Present-gated in the lambda, but still recorder-heavy under motion => exclude
  # from recorder + consume live via pyscript if DB growth matters.
  - platform: template
    name: "Radar Frame"
    id: radar_frame
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "ESP Reset Reason"
      icon: mdi:anchor
      disabled_by_default: True
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
      entity_category: "diagnostic"
      disabled_by_default: True
      icon: mdi:ip-network
  - platform: template
    name: "Zone1 Info"
    id: tips_zone1_conf
    icon: mdi:information-outline
    entity_category: config
    lambda: |-
      return {"Configure below" };
    update_interval: 1000s
  - platform: template
    name: "Zone2 Info"
    id: tips_zone2_conf
    icon: mdi:information-outline
    entity_category: config
    lambda: |-
      return {"Configure below" };
    update_interval: 1000s
  - platform: template
