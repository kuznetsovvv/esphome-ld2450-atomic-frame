          id(tips_zone_ex1_conf).publish_state("Zone Exclusion 1");

  # ===== LD2450 chip command scaffolding =====
  # Framing verified against esphome/esphome components/ld2450 (dev) 2026-06-29:
  #   Frame: FD FC FB FA | length(LE16) | command(LE16) | value... | 04 03 02 01
  #   Config gate: enable = cmd 0x00FF value {01 00}; end = cmd 0x00FE no value.
  # ACK responses are decoded by the realign parser in uart: -> chip_* read-back entities.
  - id: ld2450_cmd_bt
    parameters:
      enable: bool
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          uint8_t v = enable ? 0x01 : 0x00;
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xA4,0x00, v,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));
      - delay: 80ms
      - lambda: |-
          // restart the module so the BT change takes effect
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xA3,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));
      - delay: 1500ms
      - script.execute: ld2450_cmd_query
  - id: ld2450_cmd_multi
    parameters:
      enable: bool
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          uint8_t cmd = enable ? 0x90 : 0x80;   // 0x90 multi, 0x80 single
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, cmd,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));
      - delay: 80ms
      - lambda: |-
          const uint8_t de[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xFE,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(de, sizeof(de));
      - delay: 150ms
      - script.execute: ld2450_cmd_query
  - id: ld2450_cmd_set_region
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          uint8_t zt = 0;
          auto opt = id(chip_zone_type).current_option();
          if (opt == "Detection") { zt = 1; } else if (opt == "Filter") { zt = 2; }
          // SET_ZONE value = zone_type(LE16) + 3 regions x {x1,y1,x2,y2} as LE16 two's-
          // complement (DIFFERENT encoding from the periodic-data sign bit!). Mode is global.
          int16_t r[12] = {
            (int16_t) id(chip_region1_x1).state, (int16_t) id(chip_region1_y1).state,
            (int16_t) id(chip_region1_x2).state, (int16_t) id(chip_region1_y2).state,
            (int16_t) id(chip_region2_x1).state, (int16_t) id(chip_region2_y1).state,
            (int16_t) id(chip_region2_x2).state, (int16_t) id(chip_region2_y2).state,
            (int16_t) id(chip_region3_x1).state, (int16_t) id(chip_region3_y1).state,
            (int16_t) id(chip_region3_x2).state, (int16_t) id(chip_region3_y2).state };
          uint8_t f[38];
          f[0]=0xFD; f[1]=0xFC; f[2]=0xFB; f[3]=0xFA;
          f[4]=0x1C; f[5]=0x00;          // length = 28 (2 command + 26 value)
          f[6]=0xC2; f[7]=0x00;          // CMD_SET_ZONE
          f[8]=zt;   f[9]=0x00;          // zone type (global across all 3 regions)
          for (int i=0;i<12;i++) {
            uint16_t u = (uint16_t) r[i];
            f[10 + i*2]     = u & 0xFF;   // little-endian
            f[10 + i*2 + 1] = (u >> 8) & 0xFF;
          }
          f[34]=0x04; f[35]=0x03; f[36]=0x02; f[37]=0x01;
          id(uart_bus).write_array(f, 38);
      - delay: 80ms
      - lambda: |-
          const uint8_t de[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xFE,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(de, sizeof(de));
      - delay: 150ms
      - script.execute: ld2450_cmd_query
  - id: ld2450_cmd_query
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xA0,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // query firmware version
      - delay: 150ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xA5,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // query MAC (=> Bluetooth state)
      - delay: 150ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0x91,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // query target mode
      - delay: 150ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xC1,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // query zone config
      - delay: 150ms
      - lambda: |-
          const uint8_t de[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xFE,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(de, sizeof(de));
  - id: ld2450_cmd_restart
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xA3,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // restart module
          // arm the recovery stopwatch: watch the max inter-frame gap for the next 3s
          id(last_frame_seen_ms) = millis();
          id(restart_max_gap_ms) = 0;
          id(restart_watch_until_ms) = millis() + 3000;
      - delay: 3500ms
      - script.execute: ld2450_cmd_query
  - id: ld2450_cmd_factory
    mode: queued
    then:
      - lambda: |-
          const uint8_t en[] = {0xFD,0xFC,0xFB,0xFA, 0x04,0x00, 0xFF,0x00, 0x01,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(en, sizeof(en));
      - delay: 80ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xA2,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // factory reset (NOTE: re-enables chip BT)
      - delay: 80ms
      - lambda: |-
          const uint8_t f[] = {0xFD,0xFC,0xFB,0xFA, 0x02,0x00, 0xA3,0x00, 0x04,0x03,0x02,0x01};
          id(uart_bus).write_array(f, sizeof(f));   // restart module
      - delay: 1500ms
      - script.execute: ld2450_cmd_query

sensor:
  # BLE RSSI updates only while each configured beacon is heard.
  - platform: ble_rssi
    ibeacon_uuid: !secret ble_beacon_1_uuid
